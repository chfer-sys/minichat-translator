# Serves the static PERSONA app and reverse-proxies /api to the internal
# proxy container (no host port). Browser base URL is "/api" (same origin),
# so OPENCODE_GO_API_KEY never leaves the proxy.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Image attachments ride base64 inside JSON on /api — 1m default is too small.
    client_max_body_size 20m;

    # /api/chat/completions -> http://proxy:3000/chat/completions (prefix stripped).
    # 127.0.0.11 is Docker's embedded DNS; the variable forces re-resolution so a
    # proxy restart with a new IP does not need an nginx reload.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $proxy_upstream http://proxy:3000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $proxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Runtime config and the service worker must never be cached — a stale
    # baseUrl or SW would survive redeploys.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Serve static files (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS URLs are unhashed and change every deploy: revalidate instead of
    # caching them, or browsers keep running the previous release.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Content-stable assets can still be cached.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
